<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>抽签工作台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#fff;overflow:hidden;overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#1b1b1b;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
body{user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}

/* ============ 首页 ============ */
#home{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:#fff}
.topbar{flex:none;height:96px;height:calc(env(safe-area-inset-top) + 44px + 52px);padding:44px 6px 0;padding:calc(env(safe-area-inset-top) + 44px) 6px 0;
  display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:21px;height:21px;stroke:#9a9a9a;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.setname{font-size:13px;color:#a0a0a0;letter-spacing:.04em;background:none;border:none;cursor:pointer;
  max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px}

.top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 26px 6px}
.card{width:100%;max-width:340px;min-height:190px;border:1px solid #ececec;border-radius:22px;background:#fff;
  box-shadow:0 14px 44px rgba(0,0,0,.055);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px}
.card.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{0%{transform:scale(.93);opacity:.35}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
.card-label{font-size:11px;letter-spacing:.32em;color:#c2c2c2;text-indent:.32em;margin-bottom:14px}
.card-text{font-size:33px;font-weight:600;line-height:1.42;text-align:center;word-break:break-word;color:#141414}
.card.placeholder .card-text{font-size:20px;font-weight:400;color:#c8c8c8;line-height:1.85}
.card.placeholder .card-label{color:#e0e0e0}

.hint{margin-top:18px;font-size:12.5px;letter-spacing:.1em;color:#adadad;text-align:center}

.boxstage{flex:none;position:relative;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;
  padding-bottom:18px;padding-bottom:calc(env(safe-area-inset-bottom) + 18px);min-height:276px;width:100%}

/* ============ 结果：物件飞到屏幕正中再打开 ============ */
.opener{position:fixed;top:0;right:0;bottom:0;left:0;z-index:110;opacity:0;pointer-events:none;transition:opacity .3s ease}
.opener.on{opacity:1;pointer-events:auto}
.op-veil{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(255,252,248,.94);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.op-rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;
  opacity:0;transform:scale(.55);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.9,.3,1.1)}
.op-rays svg{display:block;width:100%;height:100%}
.opener.on .op-rays{opacity:1;transform:scale(1)}
.op-item{position:absolute;left:50%;top:50%;z-index:2;
  transform:translate(-50%,-50%) scale(.5);will-change:transform}
.op-half{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  transition:transform .55s cubic-bezier(.2,.9,.3,1.15),opacity .4s ease}
.op-half.up{clip-path:inset(0 0 50.5% 0)}
.op-half.dn{clip-path:inset(49.5% 0 0 0)}
.opener.crack .op-half.up{transform:translate(-50%,-50%) translate(-13px,-26px) rotate(-7deg)}
.opener.crack .op-half.dn{transform:translate(-50%,-50%) translate(12px,24px) rotate(6deg)}
.opener.away .op-half{opacity:0}
.op-cap-face{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-size:52px;line-height:1;
  text-shadow:0 2px 6px rgba(0,0,0,.08);pointer-events:none}
.op-card.tp-mode{width:auto;min-height:0;background:none;border:none;box-shadow:none;padding:0;
  transform:translate(-50%,-50%) scale(.74);opacity:0;
  transition:transform .52s cubic-bezier(.2,.9,.3,1.15),opacity .3s ease}
.opener.tpshow .op-card.tp-mode{transform:translate(-50%,-50%) scale(1);opacity:1}
.tp-flip{position:relative;width:168px;height:376px;transform-style:preserve-3d;
  transition:transform .96s cubic-bezier(.25,.8,.25,1)}
.opener.tpn .tp-flip{transform:rotateY(180deg)}
.tp-face{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;box-shadow:0 22px 44px rgba(150,100,130,.3)}
.tp-face img{width:100%;height:100%;object-fit:cover;display:block}
.tp-face.tp-f{transform:rotateY(180deg)}
.tp-txt{position:absolute;left:15%;right:15%;top:18%;bottom:18%;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#2B2622;font-weight:600;line-height:1.65;word-break:break-word;letter-spacing:.02em;
  opacity:0;transition:opacity .35s ease}
.tp-txt.on{opacity:1}
.op-card.sg-mode{width:auto;min-height:0;background:none;border:none;box-shadow:none;padding:0;
  transform:translate(-50%,-50%) scale(.8);opacity:0;
  transition:transform .5s cubic-bezier(.2,.9,.3,1.16),opacity .3s ease}
.sg{position:relative}
.sg-img{display:block;border-radius:16px;object-fit:cover;box-shadow:0 20px 42px rgba(190,120,155,.32)}
.sg-txt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(255,253,246,.96);border:2px solid #FFC9DD;border-radius:16px;padding:10px 18px;
  font-weight:600;color:#4A3B3B;text-align:center;line-height:1.5;letter-spacing:.02em;
  width:74%;box-sizing:border-box;word-break:break-word;box-shadow:0 8px 18px rgba(190,120,155,.22);
  opacity:0;transition:opacity .35s ease .45s}
.sg-txt.on{opacity:1}
.op-whole{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
  transition:transform .5s cubic-bezier(.2,.9,.3,1.15),opacity .4s ease}
.opener.away .op-whole{transform:translate(-50%,-50%) scale(1.12);opacity:0}
.op-card{position:absolute;left:50%;top:50%;z-index:3;width:262px;min-height:296px;
  transform:translate(-50%,-50%) rotate(-1.6deg) scale(.55);opacity:0;
  transition:transform .5s cubic-bezier(.2,.9,.3,1.15),opacity .35s ease}
.opener.fold .op-card{transform:translate(-50%,-50%) rotate(-1.6deg) scale(1);opacity:1}
.op-paper{position:relative;width:100%;min-height:296px;overflow:hidden;
  background:#FFF8E3;border:3px solid #2B2622;border-radius:24px;
  box-shadow:0 22px 46px rgba(150,110,80,.26),0 6px 0 rgba(43,38,34,.06);
  padding:38px 22px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.op-paper::before{content:"";position:absolute;top:16px;left:50%;margin-left:-28px;width:56px;height:6px;
  border-radius:4px;background:#F6B8CB}
.p-top{font-size:10.5px;letter-spacing:.34em;text-indent:.34em;color:#B79A6A;margin-bottom:20px}
.p-text{font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif;font-size:26px;font-weight:600;
  color:#2B2622;text-align:center;line-height:1.55;word-break:break-word;letter-spacing:.02em;
  opacity:0;transform:translateY(8px)}
.p-foot{position:absolute;bottom:24px;left:0;right:0;text-align:center;
  font-size:10px;letter-spacing:.18em;color:#CCC2AF;opacity:0;transition:opacity .4s ease .5s}
.opener.fold .p-foot{opacity:1}

/* —— 抽出的物件（按图纸的手绘描边风） —— */
.sh{position:relative}
.sh svg{display:block}
.sh-star{--c:#FFD764}
/* ============ 1 开局一个桶 ============ */
.bx-bucket{position:relative;width:238px;height:276px;transform-origin:50% 96%}
.bl-sticks{position:absolute;left:0;right:0;bottom:104px;height:150px;z-index:1}
.bl-stick{position:absolute;bottom:0;width:26px;border-radius:13px;background:var(--c);
  border:3px solid #2F2723;transition:transform .45s cubic-bezier(.2,.9,.3,1.3)}
.bl-head{position:absolute;top:-36px;left:50%;margin-left:-23px;width:46px;height:42px;
  border-radius:50% 50% 44% 44%;background:var(--c);border:3px solid #2F2723}
.bl-head .ear{position:absolute;background:var(--c);border:3px solid #2F2723}
.bl-head.ear-bear .ear{width:22px;height:22px;border-radius:50%;top:-9px}
.bl-head.ear-bear .ear.l{left:-3px}
.bl-head.ear-bear .ear.r{right:-3px}
.bl-head.ear-rabbit .ear{width:13px;height:32px;border-radius:7px;top:-26px}
.bl-head.ear-rabbit .ear.l{left:9px;transform:rotate(-6deg)}
.bl-head.ear-rabbit .ear.r{right:9px;transform:rotate(6deg)}
.bl-head.ear-dog .ear{width:18px;height:30px;border-radius:50%;top:5px}
.bl-head.ear-dog .ear.l{left:-11px;transform:rotate(16deg)}
.bl-head.ear-dog .ear.r{right:-11px;transform:rotate(-16deg)}
.bl-head.ear-sheep .ear{width:24px;height:16px;border-radius:50%;background:#F7DFDA;top:8px}
.bl-head.ear-sheep .ear.l{left:-14px;transform:rotate(-14deg)}
.bl-head.ear-sheep .ear.r{right:-14px;transform:rotate(14deg)}
.bl-head .eye{position:absolute;top:18px;width:6px;height:6px;border-radius:50%;background:#2F2723;z-index:3}
.bl-head .eye.l{left:10px}
.bl-head .eye.r{right:10px}
.bl-head .snout{position:absolute;top:28px;left:50%;margin-left:-5px;width:9px;height:6px;
  border-radius:50%;background:rgba(47,39,35,.8);z-index:3}
.bl-head .blush{position:absolute;top:29px;width:10px;height:6px;border-radius:50%;
  background:rgba(240,140,150,.42);z-index:2}
.bl-head .blush.l{left:3px}
.bl-head .blush.r{right:3px}
.bl-stick .arm{position:absolute;top:3px;width:12px;height:8px;border-radius:50%;
  background:var(--c);border:3px solid #2F2723;z-index:1}
.bl-stick .arm.l{left:-9px;transform:rotate(18deg)}
.bl-stick .arm.r{right:-9px;transform:rotate(-18deg)}
.bl-body{position:absolute;bottom:0;left:8px;right:8px;height:116px;overflow:hidden;z-index:2;
  background:#F169A4;border:3px solid #2F2723;border-radius:10px 10px 34px 34px}
.bl-band{position:absolute;top:0;left:0;right:0;height:34px;background:#FBE07F;border-bottom:3px solid #2F2723}
.bl-rim{position:absolute;bottom:104px;left:3px;right:3px;height:30px;border-radius:50%;z-index:3;
  background:#FCE7A0;border:3px solid #2F2723}
.bx-bucket.shaking{animation:shake .8s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  0%{transform:rotate(0) translate(0,0)}
  15%{transform:rotate(-9deg) translate(-4px,2px)}
  32%{transform:rotate(8deg) translate(5px,-2px)}
  48%{transform:rotate(-7deg) translate(-4px,2px)}
  64%{transform:rotate(6deg) translate(3px,-1px)}
  82%{transform:rotate(-3deg) translate(-2px,1px)}
  100%{transform:rotate(0) translate(0,0)}
}

/* ============ 2 卡牌转盘 ============ */
.cw{width:100%;max-width:344px}
.cw-wrap{position:relative;touch-action:none;height:216px;overflow:hidden;border-radius:22px;background:#FFF4F8;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.cw-strip{position:absolute;left:0;top:0;height:100%;display:flex;padding:8px 0;will-change:transform}

.sl-photo{display:block;width:100%;height:auto}
.sl-wins{position:absolute;left:22.25%;top:38.61%;width:60.11%;height:22.57%;
  opacity:0;transition:opacity .12s linear;pointer-events:none}
.sl.spinning .sl-wins{opacity:1}
.sl-win{position:absolute;top:0;height:100%;overflow:hidden}
.sl-win:nth-child(1){left:0;width:34.05%}
.sl-win:nth-child(2){left:34.59%;width:31.63%}
.sl-win:nth-child(3){left:66.76%;width:33.24%}
.sl-strip{position:absolute;left:0;top:0;width:100%;height:900%;display:block}
.sl.sl-shake{animation:slShake .55s ease both}
/* 抽中后翻卡：背面=三格图案，正面=空白卡+居中文字 */
.slf{position:relative;width:var(--w,220px);height:calc(var(--w,220px) * 32 / 18);perspective:1400px}
.slf-in{position:absolute;top:0;right:0;bottom:0;left:0;transform-style:preserve-3d;
  transition:transform .98s cubic-bezier(.25,.8,.25,1)}
.slf.on .slf-in{transform:rotateY(180deg)}
.slf-face{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:14px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 22px 46px rgba(90,60,40,.4)}
.slf-face img{display:block;width:100%;height:100%;object-fit:cover}
.slf-face.f{transform:rotateY(180deg)}
.slf-txt{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;text-align:center;
  color:#4A2E1C;font-weight:600;line-height:1.75;letter-spacing:.04em;padding:0 20%;word-break:break-word}
.slf-hint{position:absolute;left:0;right:0;bottom:-32px;text-align:center;
  font-size:13px;color:#7d6a52;letter-spacing:.14em;animation:slfHint 1.8s ease-in-out infinite}
@keyframes slfHint{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes slShake{
  0%{transform:translateX(0)}18%{transform:translateX(-6px)}
  38%{transform:translateX(6px)}58%{transform:translateX(-3px)}
  78%{transform:translateX(3px)}100%{transform:translateX(0)}
}

/* ============ 4 大转盘 ============ */
.wh{position:relative;width:314px;height:330px;touch-action:none;transform:scale(1.36);transform-origin:50% 50%}
.wh-disc{position:absolute;left:50%;top:10px;transform:translateX(-50%) rotate(0deg);
  width:300px;height:300px;border-radius:50%;overflow:hidden;
  box-shadow:inset 0 0 0 1px #f5f0e2,0 16px 40px rgba(140,110,70,.18);
  will-change:transform;backface-visibility:hidden;
  transition:transform 2.4s cubic-bezier(.12,.82,.16,1)}
.wh-sep{position:absolute;left:50%;top:50%;width:9px;height:92px;margin-left:-4.5px;
  background:#fff;opacity:.97;border-radius:5px 5px 4px 4px;
  transform-origin:50% 0;pointer-events:none;box-shadow:0 0 0 .5px rgba(255,255,255,.9)}
.wh-lay{position:absolute;left:50%;top:50%;width:0;height:0}
.wh-pos{position:absolute;left:0;top:0;transform:translate(-50%,-50%) translateY(-108px)}
.wh-t{display:block;white-space:nowrap;color:#ED7A12;font-weight:800;line-height:1;
  letter-spacing:.02em;pointer-events:none;transform:rotate(90deg);transform-origin:50% 50%}
.wh-hub{position:absolute;left:50%;top:166px;transform:translate(-50%,-50%);width:156px;height:156px;
  border-radius:0;border:none;background:none;
  display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.wh-hub img.wh-hub-img{display:block;width:148px;height:auto;pointer-events:none;-webkit-user-drag:none;user-select:none;
  filter:drop-shadow(0 6px 12px rgba(150,110,40,.22))}
.wh-hub svg{display:block;width:104px;height:112px}
.wh-hub.spin-on{animation:hubBob .55s ease}
@keyframes hubBob{0%,100%{transform:translate(-50%,-50%)}40%{transform:translate(-50%,-58%)}}

/* ============ 5 签绳玻璃罐 ============ */
.jr{position:relative;width:238px;height:264px;transform:scale(1.62);transform-origin:50% 50%}
.jr-lid{position:absolute;top:0;left:50%;transform:translateX(-50%);width:152px;height:26px;border-radius:9px;
  background:linear-gradient(180deg,#ded8ec,#b7add0);border:2px solid #6c6180;z-index:3}
.jr-glass{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:186px;height:206px;
  border-radius:24px 24px 34px 34px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(226,241,249,.9));
  border:2px solid rgba(126,150,170,.55);
  box-shadow:inset 14px 0 24px rgba(255,255,255,.85),inset -16px 0 26px rgba(160,190,210,.3),
             0 16px 34px rgba(120,150,170,.18)}
.jr-gloss{position:absolute;top:16px;left:12px;width:14px;height:110px;border-radius:9px;z-index:0;
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0))}
.jr-item{position:absolute;top:1px;z-index:2;display:flex;flex-direction:column;align-items:center;pointer-events:none;
  transition:transform .5s cubic-bezier(.22,.9,.3,1);will-change:transform}
.jr-str{width:1.4px;background:rgba(120,145,165,.65)}
.jr-f{font-size:21px;line-height:1;margin-top:-1px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.1));
  transition:transform .4s;pointer-events:auto;cursor:pointer}
.jr.tug{animation:tug .5s ease-out}
@keyframes tug{0%{transform:rotate(0)}25%{transform:rotate(-1.6deg)}55%{transform:rotate(1.4deg)}100%{transform:rotate(0)}}

/* ============ 6 扭蛋机 ============ */
.ga{position:relative;width:238px;height:302px}
.ga-dome{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:202px;height:186px;
  border-radius:48% 48% 36% 36%;z-index:2;overflow:visible;border:3px solid #2B2622;
  background:radial-gradient(circle at 34% 24%,#FFFDF6,#FFF6DA 52%,#FCE9AE)}
.ga-lid{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:104px;height:44px;
  border-radius:999px;background:#8B85C6;border:3px solid #2B2622;z-index:4;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.ga-bubble{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;z-index:1;
  background:radial-gradient(circle at 32% 26%,#fff,#FFF9E8 56%,#F7E9C4);
  border:2.4px solid #2B2622;box-shadow:0 3px 8px rgba(150,120,60,.14);
  transition:transform .35s ease,opacity .35s ease}
.ga-bubble.gone{transform:scale(.3) translateY(14px);opacity:0}
.ga-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:216px;height:130px;
  border-radius:16px;background:#F8EDE1;border:3px solid #2B2622;z-index:3;
  box-shadow:inset 0 6px 0 rgba(255,255,255,.6)}
.ga-slot{position:absolute;left:16px;top:18px;width:52px;height:54px;border-radius:10px;
  background:#7FB3DC;border:2.6px solid #2B2622;display:flex;align-items:center;justify-content:center}
.ga-slot i{width:26px;height:26px;border-radius:50%;background:#3E7AB0;border:2px solid #2B2622}
.ga-knob{position:absolute;left:50%;margin-left:-28px;top:14px;width:56px;height:56px;border-radius:50%;
  background:#FFD764;border:3px solid #2B2622;transition:transform .5s cubic-bezier(.3,.9,.3,1)}
.ga-knob::after{content:"";position:absolute;left:50%;top:8px;width:3px;height:38px;margin-left:-1.5px;
  background:#2B2622;border-radius:2px;transform:rotate(18deg)}
.ga-jars{position:absolute;right:14px;top:18px;width:54px;height:54px;display:flex;align-items:flex-end}
.ga-jars u{display:block;width:22px;border-radius:11px;border:2.4px solid #2B2622}
.ga-jars u:nth-child(1){height:44px;background:#9A93CF}
.ga-jars u:nth-child(2){height:36px;background:#7FB3DC}
.ga-band{position:absolute;left:-3px;right:-3px;bottom:-3px;height:28px;border-radius:0 0 16px 16px;
  background:#F7A9BC;border:3px solid #2B2622;display:flex;align-items:center;justify-content:center}
.ga-band b{font-size:9.5px;letter-spacing:.16em;color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.ga-band s{font-size:9px;color:#fff;text-decoration:none}
.ga-capsule{position:absolute;left:44px;bottom:24px;width:44px;height:44px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 32% 26%,#fff,#FFF9E8 56%,#F7E9C4);border:2.4px solid #2B2622;
  box-shadow:0 6px 14px rgba(0,0,0,.14);opacity:0;
  display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1}

/* ============ 抽屉 ============ */
.dmask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,15,15,.3);z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}
.dmask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:306px;z-index:75;background:#fff;
  transform:translateX(-104%);transition:transform .34s cubic-bezier(.22,.9,.32,1);
  display:flex;flex-direction:column;padding:34px 0 22px;padding:calc(env(safe-area-inset-top) + 34px) 0 calc(env(safe-area-inset-bottom) + 22px);
  box-shadow:8px 0 40px rgba(0,0,0,.1)}
.drawer.on{transform:none}
.dsets{display:none;margin:-4px 0 10px;padding:0 34px}
.drawer.on .dsets{display:block}
.dset{border-radius:14px;background:#FFF8FB;border:1px solid #FFE6EF;margin-bottom:8px;overflow:hidden}
.dset.open{background:#FFF1F7;border-color:#FFC9DD}
.dset-h{display:flex;align-items:center;padding:10px 12px;cursor:pointer}
.dset-n{flex:1;font-size:13px;color:#3a3330;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dset-c{font-size:11px;color:#B69AA6;flex:none}
.dset-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 12px}
.dset.open .dset-body{max-height:520px;padding:0 12px 10px}
.dset-li{font-size:12px;color:#8a7d84;line-height:1.9;border-top:1px dashed #FFE0EB;padding-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dset-go{display:block;margin-top:8px;width:100%;padding:8px;border-radius:10px;border:none;
  background:linear-gradient(180deg,#FFC0D8,#F98BB6);color:#fff;font-size:12px;font-weight:700;font-family:inherit}
.dset-none{font-size:12px;color:#b9a7ae}
.dtitle{font-size:22px;font-weight:600;letter-spacing:.02em;padding:0 26px}
.dsub{font-size:11.5px;letter-spacing:.24em;color:#bdbdbd;padding:8px 26px 24px}
.ditem{display:flex;align-items:center;padding:15px 26px;border:none;background:none;
  text-align:left;font-size:15.5px;cursor:pointer;color:#2a2a2a}
.ditem svg{width:20px;height:20px;stroke:#b3b3b3;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ditem .now{margin-left:auto;font-size:10.5px;color:#c6c6c6;letter-spacing:.08em}
.ditem:active{background:#fafafa}
.dline{margin:14px 26px;height:1px;background:#f2f2f2}
.dfoot{margin-top:auto;padding:0 26px;font-size:12px;color:#b5b5b5;line-height:1.9}
.dfoot b{font-weight:500;color:#6b6b6b}

/* ============ 视图 ============ */
.view{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:#fff;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .34s cubic-bezier(.22,.9,.32,1);visibility:hidden}
.view.on{transform:none;visibility:visible}
.vhead{flex:none;height:56px;height:calc(env(safe-area-inset-top) + 56px);padding:0px 10px 0;padding:env(safe-area-inset-top) 10px 0;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f4f4f4}
.vtitle{font-size:16px;font-weight:600;letter-spacing:.02em}
.vhead .iconbtn svg{width:18px;height:18px}
.vbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 22px calc(env(safe-area-inset-bottom) + 110px)}
.lab{font-size:11.5px;letter-spacing:.18em;color:#b8b8b8;margin:24px 0 12px}
.lab:first-child{margin-top:4px}

.inp{width:100%;height:46px;border:1px solid #ededed;border-radius:14px;background:#fbfbfb;
  padding:0 15px;font-size:15px;outline:none;-webkit-appearance:none}
.inp:focus{background:#fff;border-color:#ddd}

.countrow{display:flex;align-items:center;justify-content:space-between;background:#fafafa;border-radius:16px;padding:10px 12px}
.countrow span{font-size:14px;color:#8f8f8f}
.countctl{display:flex;align-items:center}
.stepbtn{width:34px;height:34px;border-radius:50%;border:1px solid #ebebeb;background:#fff;font-size:17px;color:#666;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.cinput{width:56px;height:34px;border:none;background:none;text-align:center;font-size:19px;font-weight:600;outline:none;-webkit-appearance:none}
.chips{display:flex;margin-top:12px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:16px;border:1px solid #eee;background:#fff;font-size:12.5px;color:#8c8c8c;cursor:pointer}
.chip.on{background:#1b1b1b;color:#fff;border-color:#1b1b1b}

.fields{margin-top:18px}
.field{display:flex;align-items:center;margin-bottom:9px}
.no{width:20px;text-align:right;font-size:11px;color:#c9c9c9;font-variant-numeric:tabular-nums}
.field input{flex:1;min-width:0;height:44px;border:1px solid #efefef;border-radius:13px;background:#fbfbfb;
  padding:0 14px;font-size:15px;outline:none}
.field input:focus{background:#fff;border-color:#dedede}

.impbox{margin-top:10px;border:1px dashed #eaeaea;border-radius:18px;padding:14px}
.impbox textarea{width:100%;height:110px;border:none;background:none;resize:none;outline:none;
  font-size:14px;line-height:1.9;color:#3a3a3a}
.impbox textarea::placeholder{color:#c3c3c3}
.impactions{display:flex;margin-top:8px}
.mini{flex:1;height:40px;border-radius:20px;border:none;font-size:13.5px;cursor:pointer}
.mini.light{background:#f4f4f4;color:#777}
.mini.dark{background:#1b1b1b;color:#fff}

.savebar{position:absolute;left:0;right:0;bottom:0;padding:14px 22px 14px;padding:14px 22px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(to top,#fff 62%,rgba(255,255,255,.86))}
.primary{width:100%;height:50px;border:none;border-radius:26px;background:#1b1b1b;color:#fff;font-size:15px;letter-spacing:.04em;cursor:pointer}
.primary:active{transform:scale(.985)}

/* 历史 */
.hrow{display:flex;align-items:center;border-bottom:1px solid #f6f6f6}
.hmain{flex:1;min-width:0;text-align:left;background:none;border:none;padding:15px 0;cursor:pointer}
.hname{font-size:15.5px;font-weight:600;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:9.5px;font-weight:400;color:#fff;background:#1b1b1b;padding:2.5px 7px;border-radius:8px;letter-spacing:.08em}
.hmeta{font-size:11.5px;color:#b8b8b8;margin-top:6px}
.hprev{font-size:12px;color:#a3a3a3;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinbtn{flex:none;height:34px;padding:0 10px;border-radius:17px;border:1px solid #f0f0f0;background:#fff;
  font-size:11px;color:#bdbdbd;cursor:pointer;white-space:nowrap}
.pinbtn.on{border-color:#1b1b1b;color:#1b1b1b}
.empty{text-align:center;color:#c6c6c6;font-size:13.5px;line-height:2;padding:60px 0}

/* 抽签方式 */
.opt{width:100%;display:flex;align-items:center;padding:20px 18px;border:1px solid #eee;border-radius:18px;
  background:#fff;margin-bottom:12px;cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s}
.opt.on{border-color:#1b1b1b;box-shadow:0 8px 26px rgba(0,0,0,.06)}
.opt-ic{flex:none;width:44px;height:44px;border-radius:14px;background:#f7f7f7;display:flex;align-items:center;justify-content:center}
.opt-ic svg{width:22px;height:22px;stroke:#8a8a8a;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.opt-t{font-size:15.5px;font-weight:600}
.opt-d{font-size:12px;color:#adadad;margin-top:5px;line-height:1.5}
.opt-check{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:1px solid #e2e2e2;position:relative}
.opt.on .opt-check{border-color:#1b1b1b;background:#1b1b1b}
.opt.on .opt-check::after{content:"";position:absolute;left:6.5px;top:3.5px;width:4.5px;height:8.5px;
  border-right:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(42deg)}

/* 签盒 */
.boxes{display:grid;grid-template-columns:1fr 1fr;grid-gap:12px}
.box-card{border:1px solid #eee;border-radius:18px;background:#fff;padding:14px 8px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;transition:border-color .2s,box-shadow .2s}
.box-card.on{border-color:#1b1b1b;box-shadow:0 8px 26px rgba(0,0,0,.06)}
.pv{position:relative;width:70px;height:76px;display:flex;align-items:flex-end;justify-content:center}
.box-name{font-size:13px;color:#5c5c5c;letter-spacing:.03em}
.box-sub{font-size:10px;color:#bdbdbd;margin-top:-4px}

/* 迷你预览 */
.pv{position:relative;width:78px;height:82px;display:flex;align-items:flex-end;justify-content:center}
.pv img.pv-photo{display:block;max-height:80px;max-width:84px;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(190,150,170,.22))}

.m-card{position:relative;width:70px;height:80px}
.m-card img{position:absolute;left:50%;top:0;width:34px;height:74px;margin-left:-17px;display:block;
  border-radius:6px;box-shadow:0 5px 12px rgba(180,110,145,.28);transform-origin:50% 96%}
.m-card img:nth-child(1){transform:rotate(-15deg) translateX(-12px)}
.m-card img:nth-child(2){z-index:3}
.m-card img:nth-child(3){transform:rotate(15deg) translateX(12px)}

.m-slot{position:relative;width:72px;height:62px;border-radius:12px;margin-bottom:6px;
  background:linear-gradient(180deg,#FFF7EA,#FFE6C6);border:2px solid #D9A45B;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 16px rgba(190,150,100,.2)}
.m-slot b{width:16px;height:30px;border-radius:5px;background:#fff;border:1px solid #E7CFA8;
  display:flex;align-items:center;justify-content:center;font:700 12px/1 "PingFang SC",system-ui,sans-serif;color:#DDA23F}
.m-slot::after{content:"";position:absolute;right:-6px;top:14px;width:4px;height:20px;border-radius:3px;background:#8A6B57}
.m-slot::before{content:"";position:absolute;right:-11px;top:31px;width:11px;height:11px;border-radius:50%;
  background:linear-gradient(180deg,#FFB6CF,#F489AE);border:1.5px solid #8A6B57}

.m-jar{position:relative;width:60px;height:78px}
.m-jar .gj{position:absolute;bottom:0;left:2px;right:2px;height:66px;border-radius:12px 12px 16px 16px;
  background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(226,236,246,.86));
  border:2px solid #B9C7D6;box-shadow:0 8px 16px rgba(150,170,190,.18)}
.m-jar::after{content:"";position:absolute;top:0;left:9px;right:9px;height:10px;border-radius:6px;
  background:linear-gradient(180deg,#E7E1F3,#C7BCDF);border:2px solid #8E82AE}
.m-jar i{position:absolute;width:3px;border-radius:2px;background:#F4A9C6;font-style:normal}
.m-jar i:nth-child(2){left:17px;bottom:22px;height:28px}
.m-jar i:nth-child(3){left:28px;bottom:26px;height:26px;background:#F7C0D6}
.m-jar i:nth-child(4){left:39px;bottom:20px;height:30px}
.m-jar i::before{content:"";position:absolute;left:50%;top:-7px;width:8px;height:8px;margin-left:-4px;
  border-radius:50%;background:#FBE07F;border:1.5px solid #2F2723}

/* 动作面板 / toast */
.smask{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,15,15,.28);z-index:95;opacity:0;pointer-events:none;transition:opacity .28s}
.smask.on{opacity:1;pointer-events:auto}
.asheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#fff;border-radius:22px 22px 0 0;
  padding:16px 14px 14px;padding:16px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(102%);
  transition:transform .3s cubic-bezier(.22,.9,.32,1);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.asheet.on{transform:none}
.astitle{font-size:12.5px;color:#a9a9a9;text-align:center;padding:6px 0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abtn{width:100%;height:50px;border:none;background:none;font-size:15.5px;color:#2a2a2a;cursor:pointer;border-radius:12px}
.abtn:active{background:#f7f7f7}
.abtn.danger{color:#c8473a}
.asplit{height:8px;background:#f6f6f6;margin:8px 0}

.toast{position:fixed;left:50%;bottom:96px;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,10px);
  background:rgba(25,25,25,.88);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:120;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 图片盒：签筒 / 扭蛋机 ===== */
.bx-bucket{width:106vw;height:auto;flex:0 0 auto}
.bl-photo{display:block;width:100%;height:auto;border-radius:20px;pointer-events:none;-webkit-user-drag:none;user-select:none;
  box-shadow:0 14px 34px rgba(190,150,165,.20)}
.ga{width:132vw;height:auto;flex:0 0 auto}
.ga.wob{animation:gaWob .74s cubic-bezier(.36,.07,.19,.97) both}
@keyframes gaWob{
  0%{transform:rotate(0) translateY(0)}
  18%{transform:rotate(-3.2deg) translateY(-3px)}
  38%{transform:rotate(2.8deg) translateY(0)}
  58%{transform:rotate(-2.2deg) translateY(-2px)}
  78%{transform:rotate(1.3deg)}
  100%{transform:rotate(0) translateY(0)}
}
/* ===== 结果：实物飞到中央再展开 ===== */
.op-card.av-off{display:none}
.av-wrap{position:relative;display:flex;justify-content:center;align-items:center}
.av-mini{position:absolute;width:62px;z-index:2;transition:opacity .28s ease,transform .34s ease}
.av-mini img{display:block;width:100%;height:auto;border-radius:9px;box-shadow:0 10px 26px rgba(180,120,140,.3)}
.av-mini.av-round{width:72px}
.av-mini.av-round img{border-radius:50%}
.opener.to-card .av-mini{opacity:0;transform:scale(.62)}
.av-card{display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.86);
  transition:opacity .3s ease,transform .42s cubic-bezier(.2,.9,.35,1.2)}
.opener.to-card .av-card{opacity:1;transform:scale(1)}
.av-card img{display:block;width:min(272px,74vw);height:auto;border-radius:18px;box-shadow:0 16px 42px rgba(170,120,140,.3)}
.av-card img.round{border-radius:0;box-shadow:none;width:min(250px,70vw)}
.av-txt{margin-top:10px;max-width:min(272px,74vw);padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.95);
  color:#3A2E2A;line-height:1.55;letter-spacing:.3px;text-align:center;font-weight:600;
  opacity:0;transform:translateY(9px);transition:opacity .4s ease,transform .44s cubic-bezier(.2,.9,.3,1.2);
  white-space:pre-wrap;word-break:break-word}
.av-txt.on{opacity:1;transform:translateY(0)}

/* ===== 抠图贴纸：签筒 / 扭蛋机 ===== */
.bl-photo{display:block;width:100%;height:auto;border-radius:0;box-shadow:none;pointer-events:none;
  -webkit-user-drag:none;user-select:none;filter:drop-shadow(0 10px 18px rgba(200,150,170,.16))}
.boxstage.bleed{padding-bottom:calc(env(safe-area-inset-bottom) + 2px)}
.op-img{display:block;height:auto;pointer-events:none;-webkit-user-drag:none;user-select:none}
.op-img.round{border-radius:50%}
.op-img.flat{border-radius:10px}

/* ===== 卡牌模式：整页只有卡牌 ===== */
#home.clean .top{display:none}
#home.clean .boxstage{flex:1;min-height:0;align-items:center}
#home.cardmode .top{display:none}
#home.cardmode .hint{display:none}
#home.cardmode .boxstage{flex:1;min-height:0;padding-bottom:8px;padding-bottom:calc(env(safe-area-inset-bottom) + 8px);align-items:center}
#home.cardmode .cw{width:100%;max-width:none;height:100%}
#home.cardmode .cw-wrap{height:100%;border-radius:0;background:transparent;
  -webkit-mask-image:none;mask-image:none}
#home.cardmode .cw-strip{height:100%;align-items:center;padding:0}
#home.cardmode .cw-btn{display:none}

.cw-card{background:none;box-shadow:none;perspective:1000px;position:relative}
.cw-in{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:12px;transform-origin:50% 50%;
  background:#FFFDF8;transition:transform .3s ease-in}
.cw-b,.cw-f{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:12px;overflow:hidden;

.cw-f{background:#FFFDF8;opacity:0}
.cw-card.showf .cw-b{opacity:0}
.cw-card.showf .cw-f{opacity:1}
.cw-f img{display:block;width:100%;height:100%;object-fit:cover}
.cw-t{position:absolute;left:16%;right:16%;top:16%;bottom:16%;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#2B2622;font-weight:600;line-height:1.6;letter-spacing:.02em;word-break:break-word}

.cw-card.on{transform:none;box-shadow:none}
.cw-card.on .cw-in{box-shadow:0 0 0 3px #FFD764,0 16px 32px rgba(175,100,145,.4)}
.cw-btns{position:absolute;left:0;right:0;bottom:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);
  display:none;justify-content:center;z-index:8}
#home.cardmode .cw-btns{display:flex}
.cw-b2{padding:11px 26px;border-radius:999px;border:2px solid #FFC7DD;background:#FFFDF9;color:#E4689B;
  font-size:14.5px;font-weight:700;letter-spacing:.1em;font-family:inherit;
  box-shadow:0 8px 18px rgba(233,110,160,.16);transition:transform .16s ease}
.cw-b2.solid{background:linear-gradient(180deg,#FFC0D8,#F98BB6);color:#fff;border-color:transparent;
  box-shadow:0 10px 22px rgba(233,110,160,.38)}
.cw-b2:active{transform:scale(.95)}
@keyframes cwShuf{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(.94)}
  55%{transform:rotate(7deg) scale(.95)}80%{transform:rotate(-3deg) scale(.98)}100%{transform:rotate(0) scale(1)}}
.cw-strip.shuf{animation:cwShuf .62s cubic-bezier(.3,.7,.3,1)}
#home.cardmode .cw-card{position:absolute;left:50%;margin:0;flex:none;
  transition:none;box-shadow:none;background:none}
#home.cardmode .cw-strip{position:absolute;top:0;right:0;bottom:0;left:0;display:block;padding:0;overflow:visible;will-change:auto}
#home.cardmode .cw{position:relative;width:100%;max-width:none;height:100%}
.op-card.tp-mode .tp-flip{width:var(--w,168px);height:calc(var(--w,168px) * 2.24)}
.cw-strip>*+*{margin-left:10px}
.ga-jars>*+*{margin-left:6px}
.ga-band>*+*{margin-left:8px}
.dset-h>*+*{margin-left:8px}
.ditem>*+*{margin-left:14px}
.countctl>*+*{margin-left:6px}
.hrow>*+*{margin-left:2px}
.field>*+*{margin-left:10px}
.hname>*+*{margin-left:8px}
.opt>*+*{margin-left:16px}
.m-slot>*+*{margin-left:3px}
.cw-btns>*+*{margin-left:12px}
.box-card>*+*{margin-top:8px}
.chips>*{margin:0 8px 8px 0}
.wh-wedge{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>

<div id="home">
  <div class="topbar">
    <button class="iconbtn" id="menuBtn" aria-label="菜单">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <button class="setname" id="setNameBtn">我的第一签</button>
    <button class="iconbtn" id="newBtn" aria-label="新建">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="top">
    <div class="card placeholder" id="card">
      <div class="card-label">本 签</div>
      <div class="card-text" id="cardText">摇一摇<br>抽出今日一签</div>
    </div>
    <div class="hint" id="hint">摇一摇，抽今日一签</div>
  </div>

  <div class="boxstage" id="boxStage"></div>
</div>

<div class="opener" id="reveal">
  <div class="op-veil"></div>
  <div class="op-rays" id="opRays"></div>
  <div class="op-item" id="opItem"></div>
  <div class="op-card" id="opCard">
    <div class="op-paper">
      <div class="p-top">本 签</div>
      <div class="p-text" id="revealText"></div>
      <div class="p-foot">轻点收起</div>
    </div>
  </div>
</div>

<div class="dmask" id="dmask"></div>
<div class="drawer" id="drawer">
  <div class="dtitle">工作台</div>
  <div class="dsub">抽签 · 记录</div>
  <button class="ditem" data-nav="create">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    写签<span class="now">录入内容</span>
  </button>
  <button class="ditem" data-nav="history">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    我的签集<span class="now" id="dCount"></span>
  </button>
  <div class="dsets" id="dSets"></div>
  <button class="ditem" data-nav="mode">
    <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
    抽签方式<span class="now" id="dMode"></span>
  </button>
  <button class="ditem" data-nav="box">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 2 7.9v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
    签盒<span class="now" id="dBox"></span>
  </button>
  <div class="dline"></div>
  <div class="dfoot">当前使用：<b id="dActive">—</b></div>
</div>

<div class="view" id="viewCreate">
  <div class="vhead">
    <button class="iconbtn viewback"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="vtitle">写签</div>
    <button class="iconbtn" id="resetCreate"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="vbody">
    <div class="lab">这套签的名字</div>
    <input class="inp" id="cName" placeholder="例如 生物化学 · 第 3 章">

    <div class="lab">需要几个签</div>
    <div class="countrow">
      <span>签的数量</span>
      <div class="countctl">
        <button class="stepbtn" id="minus">−</button>
        <input class="cinput" id="cCount" value="8" inputmode="numeric">
        <button class="stepbtn" id="plus">+</button>
      </div>
    </div>
    <div class="chips">
      <button class="chip" data-n="5">5 个</button>
      <button class="chip" data-n="10">10 个</button>
      <button class="chip" data-n="20">20 个</button>
      <button class="chip" data-n="30">30 个</button>
    </div>

    <div class="lab">逐条填写</div>
    <div class="fields" id="fields"></div>

    <div class="lab">批量导入</div>
    <div class="impbox">
      <textarea id="importTa" placeholder="每行一条，直接粘贴进来&#10;例：&#10;糖酵解的关键酶&#10;三羧酸循环的限速酶&#10;氧化磷酸化的偶联位点"></textarea>
      <div class="impactions">
        <button class="mini light" id="fileBtn">选择文件</button>
        <button class="mini dark" id="importBtn">导入到上面</button>
      </div>
      <input type="file" id="fileInput" accept=".txt,.csv,text/plain" style="display:none">
    </div>
  </div>
  <div class="savebar"><button class="primary" id="saveSet">保存这套签</button></div>
</div>

<div class="view" id="viewHistory">
  <div class="vhead">
    <button class="iconbtn viewback"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="vtitle">我的签集</div>
    <button class="iconbtn" id="histNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="vbody" id="histList"></div>
</div>

<div class="view" id="viewMode">
  <div class="vhead">
    <button class="iconbtn viewback"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="vtitle">抽签方式</div>
    <div style="width:44px"></div>
  </div>
  <div class="vbody">
    <div class="lab">选好后，下次打开直接生效</div>
    <button class="opt" data-mode="shake">
      <div class="opt-ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10 19.5h4"/><path d="M3 8.5c-1.2 2.2-1.2 4.8 0 7"/><path d="M21 8.5c1.2 2.2 1.2 4.8 0 7"/></svg></div>
      <div><div class="opt-t">摇一摇</div><div class="opt-d">摇动手机，签盒才会动</div></div>
      <div class="opt-check"></div>
    </button>
    <button class="opt" data-mode="click">
      <div class="opt-ic"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 11V6.5a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-1.6a6 6 0 0 1-4.9-2.6L3 17.6"/></svg></div>
      <div><div class="opt-t">点击抽签</div><div class="opt-d">点一下签盒，直接出签</div></div>
      <div class="opt-check"></div>
    </button>
    <div class="lab">说明</div>
    <div style="font-size:12.5px;color:#a9a9a9;line-height:1.9">「签绳玻璃罐」固定为点小动物拉绳，不受这里影响。</div>
  </div>
</div>

<div class="view" id="viewBox">
  <div class="vhead">
    <button class="iconbtn viewback"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="vtitle">签盒</div>
    <div style="width:44px"></div>
  </div>
  <div class="vbody">
    <div class="lab">挑一个顺眼的</div>
    <div class="boxes" id="boxGrid"></div>
  </div>
</div>

<div class="smask" id="smask"></div>
<div class="asheet" id="asheet">
  <div class="astitle" id="asTitle">—</div>
  <button class="abtn" id="asEdit">编辑这套签</button>
  <button class="abtn" id="asUse">切换到这套签</button>
  <div class="asplit"></div>
  <button class="abtn danger" id="asDel">删除</button>
  <button class="abtn" id="asCancel">取消</button>
</div>
<div class="toast" id="toast"></div>

<script src="app.js" charset="utf-8"></script>
</body>
</html>
